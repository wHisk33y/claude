name: Android APK

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: knuffi-latest

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew --stacktrace :core:test :app:assembleDebug :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Knuffi.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Knuffi-debug.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: knuffi-apk
          path: dist/

      - name: Publish APK as pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$RELEASE_TAG" --cleanup-tag -y || true
          gh release create "$RELEASE_TAG" dist/Knuffi.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Knuffi (neuester Build)" \
            --notes "Automatisch gebaut aus Commit ${GITHUB_SHA::7} (Branch ${GITHUB_REF_NAME}). Lade **Knuffi.apk** auf dein Android-Gerät (Android 8.0 oder neuer) und installiere sie. Eventuell musst du die Installation aus unbekannten Quellen erlauben."

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: knuffi-apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshots and smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/ci-emulator.sh

      - name: Pack screenshots
        if: always()
        run: |
          if [ -d shots ]; then cd shots && zip -qr ../screenshots.zip . ; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/

      - name: Attach screenshots to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f screenshots.zip ]; then gh release upload "$RELEASE_TAG" screenshots.zip --clobber || true; fi
